<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cashew Past Papers</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f7f8fc;
            --card: #ffffff;
            --text: #202536;
            --muted: #73798c;
            --primary: #ff3976;
            --border: #e7e9f0;
            --shadow: 0 8px 25px rgba(30, 35, 60, 0.08);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ---------------- NAVBAR ---------------- */

        nav {
            background: white;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            max-width: 1200px;
            margin: auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            color: var(--muted);
            font-size: 14px;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* ---------------- MAIN ---------------- */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 50px 24px 80px;
        }

        /* ---------------- HERO ---------------- */

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 68px);
            letter-spacing: -3px;
            margin-bottom: 18px;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero p {
            max-width: 650px;
            margin: auto;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.6;
        }

        .version {
            margin-top: 10px;
            font-size: 12px;
            color: #9a9ead;
            font-weight: 600;
        }

        /* ---------------- SEARCH ---------------- */

        .search-wrapper {
            max-width: 750px;
            margin: 0 auto 50px;
        }

        .search-box {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 6px 18px;
            display: flex;
            align-items: center;
        }

        .search-icon {
            font-size: 20px;
            margin-right: 12px;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 14px 5px;
            font-size: 16px;
            color: var(--text);
        }

        /* ---------------- SECTION ---------------- */

        .section-title {
            margin-bottom: 20px;
        }

        .section-title h2 {
            font-size: 25px;
        }

        .section-title p {
            color: var(--muted);
            margin-top: 5px;
        }

        /* ---------------- SUBJECTS ---------------- */

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .subject-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 35px rgba(30, 35, 60, 0.12);
            border-color: #ffd0df;
        }

        .subject-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #fff0f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .arrow {
            color: var(--muted);
            font-size: 22px;
        }

        .subject-card h3 {
            margin-top: 20px;
            font-size: 23px;
        }

        .subject-code {
            color: var(--muted);
            margin-top: 5px;
            font-size: 14px;
        }

        .subject-description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin-top: 14px;
        }

        /* ---------------- CATEGORY CARDS ---------------- */

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .category-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .category-card:hover {
            transform: translateY(-4px);
            border-color: #ffd0df;
            box-shadow: 0 14px 35px rgba(30, 35, 60, 0.12);
        }

        .category-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff0f5;
            border-radius: 13px;
            font-size: 22px;
        }

        .category-card h3 {
            margin-top: 18px;
            font-size: 21px;
        }

        .category-card p {
            color: var(--muted);
            margin-top: 7px;
            font-size: 14px;
        }

        /* ---------------- PAGE HEADER ---------------- */

        .page-header {
            margin-bottom: 25px;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 18px;
            padding: 0;
        }

        .page-header h1 {
            font-size: 36px;
            letter-spacing: -1px;
        }

        .page-header p {
            color: var(--muted);
            margin-top: 8px;
        }

        /* ---------------- FILTERS ---------------- */

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 24px 0 30px;
        }

        .filter-btn {
            background: white;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 9px 15px;
            border-radius: 9px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ---------------- YEAR ---------------- */

        .year-section {
            margin-bottom: 35px;
        }

        .year-title {
            font-size: 25px;
            margin-bottom: 14px;
        }

        .session-list {
            display: grid;
            gap: 12px;
        }

        .session-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .session-card:hover {
            transform: translateX(3px);
            border-color: #ffd0df;
        }

        .session-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .folder-icon {
            width: 44px;
            height: 44px;
            background: #eefbfc;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 21px;
        }

        .session-name {
            font-weight: 700;
        }

        .session-count {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }

        .session-arrow {
            color: var(--muted);
        }

        /* ---------------- PAPERS ---------------- */

        .paper-list {
            display: grid;
            gap: 14px;
            margin-top: 25px;
        }

        .paper-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .paper-info h3 {
            font-size: 18px;
        }

        .paper-info p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        .paper-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .paper-btn {
            border: none;
            background: #f0f1f6;
            padding: 9px 13px;
            border-radius: 8px;
            color: var(--text);
        }

        .paper-btn.primary {
            background: var(--primary);
            color: white;
        }

        .paper-btn:hover {
            opacity: 0.85;
        }

        /* ---------------- LOADING ---------------- */

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 4px solid #ececf2;
            border-top-color: var(--primary);
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------------- EMPTY / ERROR ---------------- */

        .empty {
            background: white;
            border: 1px dashed var(--border);
            border-radius: 15px;
            padding: 50px 20px;
            text-align: center;
            color: var(--muted);
        }

        .error-message {
            background: #fff3f5;
            border: 1px solid #ffd4de;
            border-radius: 15px;
            padding: 25px;
            color: #a52645;
            line-height: 1.6;
        }

        .error-message strong {
            display: block;
            margin-bottom: 8px;
        }

        /* ---------------- FOOTER ---------------- */

        footer {
            text-align: center;
            padding: 35px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
        }

        /* ---------------- MOBILE ---------------- */

        @media (max-width: 700px) {

            .nav-links {
                display: none;
            }

            main {
                padding: 40px 16px 60px;
            }

            .subject-grid,
            .category-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 46px;
            }

            .paper-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .paper-actions {
                width: 100%;
            }

            .paper-btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="nav-inner">

        <div class="logo">
            Cashew<span>Papers</span>
        </div>

        <div class="nav-links">
            <a href="#" onclick="showHome(); return false;">Home</a>
        </div>

    </div>
</nav>

<main id="app"></main>

<footer>
    Cashew Papers · Built for students
</footer>


<script>

/* ============================================================
   CONFIGURATION
   ============================================================ */

const GITHUB_OWNER = "ugaryt-market";
const GITHUB_REPO = "cashewpapers";
const GITHUB_BRANCH = "main";

const GITHUB_TREE_URL =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;

const RAW_BASE =
    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}`;


/* ============================================================
   SUBJECTS
   ============================================================ */

const subjects = {

    mathematics: {
        name: "Mathematics",
        code: "9709",
        icon: "📐",
        description: "AS & A Level Mathematics past papers.",
        hasCategories: true
    },

    physics: {
        name: "Physics",
        code: "9702",
        icon: "⚛️",
        description: "AS & A Level Physics past papers.",
        hasCategories: false
    },

    chemistry: {
        name: "Chemistry",
        code: "9701",
        icon: "🧪",
        description: "AS & A Level Chemistry past papers.",
        hasCategories: false
    },

    biology: {
        name: "Biology",
        code: "9700",
        icon: "🧬",
        description: "AS & A Level Biology past papers.",
        hasCategories: false
    }

};


/* ============================================================
   MATHEMATICS CATEGORIES
   ============================================================ */

const mathematicsCategories = {

    pure: {
        name: "Pure Mathematics",
        icon: "📐",
        description: "Pure Mathematics papers and mark schemes."
    },

    statistics: {
        name: "Statistics",
        icon: "📊",
        description: "Statistics papers and mark schemes."
    }

};


/* ============================================================
   PAPER DATABASE
   ============================================================ */

let repositoryFiles = null;
let paperDatabase = {};


/* ============================================================
   LOAD GITHUB REPOSITORY
   ============================================================ */

async function loadRepositoryFiles() {

    if (repositoryFiles) {
        return repositoryFiles;
    }

    const response = await fetch(
        GITHUB_TREE_URL,
        {
            cache: "no-store"
        }
    );

    if (!response.ok) {

        throw new Error(
            `GitHub returned ${response.status}`
        );

    }

    const data = await response.json();

    if (data.truncated) {

        throw new Error(
            "The repository contains too many files for the GitHub tree scanner."
        );

    }

    repositoryFiles = data.tree.filter(
        item =>
            item.type === "blob" &&
            item.path.toLowerCase().startsWith("papers/") &&
            item.path.toLowerCase().endsWith(".pdf")
    );

    buildPaperDatabase();

    return repositoryFiles;
}


/* ============================================================
   PARSE PAPER FILENAME
   ============================================================ */

function parseFilename(filename) {

    const match = filename.match(
        /^(\d+)_([a-z]\d{2})_(qp|ms|er|in)_(\d+)\.pdf$/i
    );

    if (!match) {
        return null;
    }

    return {
        code: match[1],
        sessionCode: match[2].toLowerCase(),
        type: match[3].toLowerCase(),
        paper: match[4]
    };
}


/* ============================================================
   SESSION NAME
   ============================================================ */

function sessionName(sessionCode) {

    if (!sessionCode) {
        return "Unknown Session";
    }

    const type =
        sessionCode[0].toLowerCase();

    const year =
        `20${sessionCode.substring(1)}`;

    if (type === "s") {
        return `May / June ${year}`;
    }

    if (type === "w") {
        return `October / November ${year}`;
    }

    if (type === "m") {
        return `March ${year}`;
    }

    return sessionCode.toUpperCase();
}


/* ============================================================
   BUILD DATABASE
   ============================================================ */

/*
   Non-Mathematics:

   papers/physics/2025/mj/file.pdf

   Mathematics:

   papers/mathematics/pure/2025/mj/file.pdf
   papers/mathematics/statistics/2025/mj/file.pdf
*/

function buildPaperDatabase() {

    paperDatabase = {};

    for (const file of repositoryFiles) {

        const parts =
            file.path.split("/");

        if (parts.length < 5) {
            continue;
        }


        const subjectKey = parts[1];

        if (!subjects[subjectKey]) {
            continue;
        }


        let category = null;
        let year;
        let folder;
        let filename;


        /* ---------------- MATHEMATICS ---------------- */

        if (subjectKey === "mathematics") {

            if (parts.length < 6) {
                continue;
            }

            category = parts[2];
            year = parts[3];
            folder = parts[4];
            filename = parts[5];

        }


        /* ---------------- OTHER SUBJECTS ---------------- */

        else {

            year = parts[2];
            folder = parts[3];
            filename = parts[4];

        }


        const parsed =
            parseFilename(filename);


        if (!parsed) {
            continue;
        }


        if (
            parsed.code !==
            subjects[subjectKey].code
        ) {
            continue;
        }


        if (!paperDatabase[subjectKey]) {
            paperDatabase[subjectKey] = {};
        }


        /*
           Mathematics:
           subject → category → year → session

           Others:
           subject → year → session
        */

        if (subjectKey === "mathematics") {

            if (!paperDatabase[subjectKey][category]) {
                paperDatabase[subjectKey][category] = {};
            }

            if (
                !paperDatabase[subjectKey][category][year]
            ) {
                paperDatabase[subjectKey][category][year] = {};
            }

            if (
                !paperDatabase[subjectKey]
                    [category]
                    [year]
                    [folder]
            ) {

                paperDatabase[subjectKey]
                    [category]
                    [year]
                    [folder] = {

                        sessionCode:
                            parsed.sessionCode,

                        papers: {}

                    };

            }

            addPaperToSession(
                paperDatabase[subjectKey]
                    [category]
                    [year]
                    [folder],
                parsed,
                file.path
            );

        }


        else {

            if (!paperDatabase[subjectKey][year]) {
                paperDatabase[subjectKey][year] = {};
            }

            if (
                !paperDatabase[subjectKey]
                    [year]
                    [folder]
            ) {

                paperDatabase[subjectKey]
                    [year]
                    [folder] = {

                        sessionCode:
                            parsed.sessionCode,

                        papers: {}

                    };

            }

            addPaperToSession(
                paperDatabase[subjectKey]
                    [year]
                    [folder],
                parsed,
                file.path
            );

        }

    }

}


/* ============================================================
   ADD PAPER TO SESSION
   ============================================================ */

function addPaperToSession(
    session,
    parsed,
    path
) {

    if (!session.papers[parsed.paper]) {

        session.papers[parsed.paper] = {

            paper: parsed.paper,
            question: null,
            markScheme: null,
            examinerReport: null,
            insert: null

        };

    }


    if (parsed.type === "qp") {

        session.papers[
            parsed.paper
        ].question = path;

    }


    if (parsed.type === "ms") {

        session.papers[
            parsed.paper
        ].markScheme = path;

    }


    if (parsed.type === "er") {

        session.papers[
            parsed.paper
        ].examinerReport = path;

    }


    if (parsed.type === "in") {

        session.papers[
            parsed.paper
        ].insert = path;

    }

}


/* ============================================================
   HOME
   ============================================================ */

function showHome() {

    const app =
        document.getElementById("app");

    app.innerHTML = `

        <section class="hero">

            <h1>
                Find your <span>past papers.</span>
            </h1>

            <p>
                A simple, modern place to find
                past papers and mark schemes.
            </p>

            <div class="version">
                Version Alpha 0.0.03
            </div>

        </section>


        <div class="search-wrapper">

            <div class="search-box">

                <div class="search-icon">
                    🔍
                </div>

                <input
                    id="homeSearch"
                    type="text"
                    placeholder="Search subjects..."
                    oninput="searchSubjects(this.value)"
                >

            </div>

        </div>


        <div class="section-title">

            <h2>Subjects</h2>

            <p>
                Choose a subject to browse past papers.
            </p>

        </div>


        <div
            class="subject-grid"
            id="subjectGrid"
        >

            ${renderSubjectCards()}

        </div>

    `;

}


/* ============================================================
   SUBJECT CARDS
   ============================================================ */

function renderSubjectCards(filter = "") {

    const query =
        filter.toLowerCase().trim();

    return Object.entries(subjects)
        .filter(([key, subject]) => {

            return (
                subject.name
                    .toLowerCase()
                    .includes(query) ||

                subject.code
                    .includes(query)
            );

        })
        .map(([key, subject]) => `

            <div
                class="subject-card"
                onclick="showSubject('${key}')"
            >

                <div class="subject-top">

                    <div class="subject-icon">
                        ${subject.icon}
                    </div>

                    <div class="arrow">
                        →
                    </div>

                </div>

                <h3>
                    ${subject.name}
                </h3>

                <div class="subject-code">
                    Cambridge ${subject.code}
                </div>

                <div class="subject-description">
                    ${subject.description}
                </div>

            </div>

        `)
        .join("");

}


function searchSubjects(query) {

    document.getElementById(
        "subjectGrid"
    ).innerHTML =
        renderSubjectCards(query);

}


/* ============================================================
   SUBJECT PAGE
   ============================================================ */

async function showSubject(subjectKey) {

    const subject =
        subjects[subjectKey];

    const app =
        document.getElementById("app");


    app.innerHTML = `

        <div class="page-header">

            <button
                class="back-btn"
                onclick="showHome()"
            >
                ← Back to subjects
            </button>

            <h1>
                ${subject.name} ${subject.code}
            </h1>

            <p>
                ${subject.description}
            </p>

        </div>


        <div class="loading">

            <div class="spinner"></div>

            Loading papers...

        </div>

    `;


    try {

        await loadRepositoryFiles();


        /*
           Mathematics gets a category page.
        */

        if (subjectKey === "mathematics") {

            showMathematicsCategories();

            return;

        }


        /*
           Other subjects go directly to years.
        */

        renderSubjectYears(subjectKey);

    } catch (error) {

        showLoadingError(
            subject,
            error
        );

    }

}


/* ============================================================
   MATHEMATICS CATEGORY PAGE
   ============================================================ */

function showMathematicsCategories() {

    const app =
        document.getElementById("app");


    app.innerHTML = `

        <div class="page-header">

            <button
                class="back-btn"
                onclick="showHome()"
            >
                ← Back to subjects
            </button>

            <h1>
                Mathematics 9709
            </h1>

            <p>
                Choose a Mathematics component.
            </p>

        </div>


        <div class="category-grid">

            ${Object.entries(
                mathematicsCategories
            ).map(
                ([categoryKey, category]) => `

                    <div
                        class="category-card"
                        onclick="showMathematicsCategory(
                            '${categoryKey}'
                        )"
                    >

                        <div class="category-icon">
                            ${category.icon}
                        </div>

                        <h3>
                            ${category.name}
                        </h3>

                        <p>
                            ${category.description}
                        </p>

                    </div>

                `
            ).join("")}

        </div>

    `;

}


/* ============================================================
   MATHEMATICS CATEGORY
   ============================================================ */

function showMathematicsCategory(
    categoryKey
) {

    const category =
        mathematicsCategories[categoryKey];


    renderCategoryYears(
        categoryKey,
        category
    );

}


/* ============================================================
   RENDER MATHEMATICS YEARS
   ============================================================ */

function renderCategoryYears(
    categoryKey,
    category
) {

    const app =
        document.getElementById("app");


    const categoryData =
        paperDatabase
            .mathematics?.[
                categoryKey
            ] || {};


    const years =
        Object.keys(categoryData)
            .sort(
                (a, b) =>
                    Number(b) - Number(a)
            );


    app.innerHTML = `

        <div class="page-header">

            <button
                class="back-btn"
                onclick="showMathematicsCategories()"
            >
                ← Back to Mathematics
            </button>

            <h1>
                ${category.name}
            </h1>

            <p>
                Mathematics 9709
            </p>

        </div>


        ${
            years.length
            ? `

                <div class="filters">

                    <button
                        class="filter-btn active"
                        onclick="filterYears(
                            this,
                            'all'
                        )"
                    >
                        All Years
                    </button>

                    ${years.map(year => `

                        <button
                            class="filter-btn"
                            onclick="filterYears(
                                this,
                                '${year}'
                            )"
                        >
                            ${year}
                        </button>

                    `).join("")}

                </div>


                <div id="yearContainer">

                    ${renderYearSections(
                        "mathematics",
                        categoryKey,
                        years
                    )}

                </div>

            `
            : `

                <div class="empty">
                    No papers have been added yet.
                </div>

            `
        }

    `;

}


/* ============================================================
   RENDER NORMAL SUBJECT YEARS
   ============================================================ */

function renderSubjectYears(subjectKey) {

    const subject =
        subjects[subjectKey];

    const years =
        getSubjectYears(
            subjectKey
        );


    const app =
        document.getElementById("app");


    app.innerHTML = `

        <div class="page-header">

            <button
                class="back-btn"
                onclick="showHome()"
            >
                ← Back to subjects
            </button>

            <h1>
                ${subject.name} ${subject.code}
            </h1>

            <p>
                ${subject.description}
            </p>

        </div>


        ${
            years.length
            ? `

                <div class="filters">

                    <button
                        class="filter-btn active"
                        onclick="filterYears(
                            this,
                            'all'
                        )"
                    >
                        All Years
                    </button>

                    ${years.map(year => `

                        <button
                            class="filter-btn"
                            onclick="filterYears(
                                this,
                                '${year}'
                            )"
                        >
                            ${year}
                        </button>

                    `).join("")}

                </div>


                <div id="yearContainer">

                    ${renderYearSections(
                        subjectKey,
                        null,
                        years
                    )}

                </div>

            `
            : `

                <div class="empty">
                    No papers have been added yet.
                </div>

            `
        }

    `;

}


/* ============================================================
   GET YEARS
   ============================================================ */

function getSubjectYears(
    subjectKey
) {

    const data =
        paperDatabase[subjectKey] || {};

    return Object.keys(data)
        .sort(
            (a, b) =>
                Number(b) - Number(a)
        );

}


/* ============================================================
   RENDER YEAR SECTIONS
   ============================================================ */

function renderYearSections(
    subjectKey,
    categoryKey,
    years
) {

    return years.map(
        year => {

            let data;

            if (subjectKey === "mathematics") {

                data =
                    paperDatabase
                        .mathematics
                        [categoryKey]
                        [year];

            } else {

                data =
                    paperDatabase
                        [subjectKey]
                        [year];

            }


            const sessions =
                Object.entries(data || {});


            return `

                <section
                    class="year-section"
                    data-year="${year}"
                >

                    <h2 class="year-title">
                        ${year}
                    </h2>


                    <div class="session-list">

                        ${
                            sessions.length
                            ? sessions.map(
                                ([folder, session]) => `

                                    <div
                                        class="session-card"
                                        onclick='showSession(
                                            "${subjectKey}",
                                            "${categoryKey || ""}",
                                            "${year}",
                                            "${folder}"
                                        )'
                                    >

                                        <div class="session-left">

                                            <div class="folder-icon">
                                                📁
                                            </div>

                                            <div>

                                                <div class="session-name">
                                                    ${sessionName(
                                                        session.sessionCode
                                                    )}
                                                </div>

                                                <div class="session-count">

                                                    ${
                                                        Object.keys(
                                                            session.papers
                                                        ).length
                                                    }

                                                    paper${
                                                        Object.keys(
                                                            session.papers
                                                        ).length !== 1
                                                            ? "s"
                                                            : ""
                                                    }

                                                </div>

                                            </div>

                                        </div>

                                        <div class="session-arrow">
                                            →
                                        </div>

                                    </div>

                                `
                            ).join("")
                            : `
                                <div class="empty">
                                    No papers found for ${year}.
                                </div>
                            `
                        }

                    </div>

                </section>

            `;

        }
    ).join("");

}


/* ============================================================
   SESSION PAGE
   ============================================================ */

function showSession(
    subjectKey,
    categoryKey,
    year,
    folder
) {

    const subject =
        subjects[subjectKey];


    let session;


    if (subjectKey === "mathematics") {

        session =
            paperDatabase
                .mathematics
                [categoryKey]
                [year]
                [folder];

    } else {

        session =
            paperDatabase
                [subjectKey]
                [year]
                [folder];

    }


    const app =
        document.getElementById("app");


    if (!session) {

        app.innerHTML = `

            <div class="empty">
                This session could not be found.
            </div>

        `;

        return;

    }


    const papers =
        Object.values(
            session.papers
        ).sort(
            (a, b) =>
                a.paper.localeCompare(
                    b.paper,
                    undefined,
                    { numeric: true }
                )
        );


    const title =
        sessionName(
            session.sessionCode
        );


    app.innerHTML = `

        <div class="page-header">

            <button
                class="back-btn"
                onclick="${
                    subjectKey === "mathematics"
                        ? `showMathematicsCategory('${categoryKey}')`
                        : `showSubject('${subjectKey}')`
                }"
            >
                ← Back
            </button>

            <h1>
                ${title}
            </h1>

            <p>
                ${subject.name}
                ${subject.code}
                ${
                    subjectKey === "mathematics"
                        ? ` · ${mathematicsCategories[categoryKey].name}`
                        : ""
                }
            </p>

        </div>


        <div class="paper-list">

            ${
                papers.length
                ? papers.map(
                    paper =>
                        renderPaper(
                            paper,
                            subject,
                            year,
                            title
                        )
                ).join("")
                : `
                    <div class="empty">
                        No papers found.
                    </div>
                `
            }

        </div>

    `;

}


/* ============================================================
   PAPER CARD
   ============================================================ */

function renderPaper(
    paper,
    subject,
    year,
    session
) {

    return `

        <div class="paper-card">

            <div class="paper-info">

                <h3>
                    Paper ${paper.paper}
                </h3>

                <p>
                    ${subject.name}
                    ${subject.code}
                    · ${year}
                    · ${session}
                </p>

            </div>


            <div class="paper-actions">

                ${
                    paper.question
                    ? `
                        <button
                            class="paper-btn primary"
                            onclick='openPDF(
                                "${paper.question}"
                            )'
                        >
                            📄 Question Paper
                        </button>
                    `
                    : ""
                }


                ${
                    paper.markScheme
                    ? `
                        <button
                            class="paper-btn"
                            onclick='openPDF(
                                "${paper.markScheme}"
                            )'
                        >
                            ✅ Mark Scheme
                        </button>
                    `
                    : ""
                }


                ${
                    paper.examinerReport
                    ? `
                        <button
                            class="paper-btn"
                            onclick='openPDF(
                                "${paper.examinerReport}"
                            )'
                        >
                            📋 Examiner Report
                        </button>
                    `
                    : ""
                }


                ${
                    paper.insert
                    ? `
                        <button
                            class="paper-btn"
                            onclick='openPDF(
                                "${paper.insert}"
                            )'
                        >
                            📎 Insert
                        </button>
                    `
                    : ""
                }

            </div>

        </div>

    `;

}


/* ============================================================
   OPEN PDF
   ============================================================ */

function openPDF(path) {

    const url =
        `${RAW_BASE}/${path
            .split("/")
            .map(
                part =>
                    encodeURIComponent(part)
            )
            .join("/")
        }`;


    window.open(
        url,
        "_blank"
    );

}


/* ============================================================
   YEAR FILTER
   ============================================================ */

function filterYears(
    button,
    year
) {

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    document
        .querySelectorAll(
            ".year-section"
        )
        .forEach(section => {

            if (
                year === "all" ||
                section.dataset.year === year
            ) {

                section.style.display =
                    "";

            } else {

                section.style.display =
                    "none";

            }

        });

}


/* ============================================================
   ERROR PAGE
   ============================================================ */

function showLoadingError(
    subject,
    error
) {

    const app =
        document.getElementById("app");


    app.innerHTML = `

        <div class="page-header">

            <button
                class="back-btn"
                onclick="showHome()"
            >
                ← Back to subjects
            </button>

            <h1>
                ${subject.name}
            </h1>

        </div>


        <div class="error-message">

            <strong>
                Could not load the papers.
            </strong>

            Make sure your GitHub repository is
            public and that the files are inside
            the <strong>papers</strong> folder.

            <br><br>

            Technical error:
            ${error.message}

        </div>

    `;

}


/* ============================================================
   START
   ============================================================ */

showHome();

</script>

</body>
</html>
