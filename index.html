<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cashew Past Papers</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f7f8fc;
            --card: #ffffff;
            --text: #202536;
            --muted: #73798c;
            --primary: #ff3976;
            --primary-dark: #e92d68;
            --border: #e7e9f0;
            --shadow: 0 8px 25px rgba(30, 35, 60, 0.08);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ---------------- NAVBAR ---------------- */

        nav {
            background: white;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            max-width: 1200px;
            margin: auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            color: var(--muted);
            font-size: 14px;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* ---------------- MAIN ---------------- */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 50px 24px 80px;
        }

        /* ---------------- HERO ---------------- */

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 68px);
            letter-spacing: -3px;
            margin-bottom: 18px;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero p {
            max-width: 650px;
            margin: auto;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.6;
        }

        .version {
            margin-top: 10px;
            font-size: 12px;
            color: #9a9ead;
            font-weight: 600;
        }

        /* ---------------- SEARCH ---------------- */

        .search-wrapper {
            max-width: 750px;
            margin: 0 auto 50px;
        }

        .search-box {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 6px 18px;
            display: flex;
            align-items: center;
        }

        .search-icon {
            font-size: 20px;
            margin-right: 12px;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 14px 5px;
            font-size: 16px;
            color: var(--text);
        }

        /* ---------------- SECTION ---------------- */

        .section-title {
            margin-bottom: 20px;
        }

        .section-title h2 {
            font-size: 25px;
        }

        .section-title p {
            color: var(--muted);
            margin-top: 5px;
        }

        /* ---------------- SUBJECTS ---------------- */

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .subject-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 35px rgba(30, 35, 60, 0.12);
            border-color: #ffd0df;
        }

        .subject-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #fff0f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .arrow {
            color: var(--muted);
            font-size: 22px;
        }

        .subject-card h3 {
            margin-top: 20px;
            font-size: 23px;
        }

        .subject-code {
            color: var(--muted);
            margin-top: 5px;
            font-size: 14px;
        }

        .subject-description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin-top: 14px;
        }

        /* ---------------- PAGE HEADER ---------------- */

        .page-header {
            margin-bottom: 25px;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 18px;
            padding: 0;
        }

        .page-header h1 {
            font-size: 36px;
            letter-spacing: -1px;
        }

        .page-header p {
            color: var(--muted);
            margin-top: 8px;
        }

        /* ---------------- FILTERS ---------------- */

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 24px 0 30px;
        }

        .filter-btn {
            background: white;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 9px 15px;
            border-radius: 9px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ---------------- YEAR ---------------- */

        .year-section {
            margin-bottom: 35px;
        }

        .year-title {
            font-size: 25px;
            margin-bottom: 14px;
        }

        .session-list {
            display: grid;
            gap: 12px;
        }

        .session-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .session-card:hover {
            transform: translateX(3px);
            border-color: #ffd0df;
        }

        .session-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .folder-icon {
            width: 44px;
            height: 44px;
            background: #eefbfc;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 21px;
        }

        .session-name {
            font-weight: 700;
        }

        .session-count {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }

        .session-arrow {
            color: var(--muted);
        }

        /* ---------------- PAPERS ---------------- */

        .paper-list {
            display: grid;
            gap: 14px;
            margin-top: 25px;
        }

        .paper-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .paper-info h3 {
            font-size: 18px;
        }

        .paper-info p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        .paper-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .paper-btn {
            border: none;
            background: #f0f1f6;
            padding: 9px 13px;
            border-radius: 8px;
            color: var(--text);
        }

        .paper-btn.primary {
            background: var(--primary);
            color: white;
        }

        .paper-btn:hover {
            opacity: 0.85;
        }

        /* ---------------- LOADING ---------------- */

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 4px solid #ececf2;
            border-top-color: var(--primary);
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------------- EMPTY ---------------- */

        .empty {
            background: white;
            border: 1px dashed var(--border);
            border-radius: 15px;
            padding: 50px 20px;
            text-align: center;
            color: var(--muted);
        }

        /* ---------------- ERROR ---------------- */

        .error-message {
            background: #fff3f5;
            border: 1px solid #ffd4de;
            border-radius: 15px;
            padding: 25px;
            color: #a52645;
            line-height: 1.6;
        }

        .error-message strong {
            display: block;
            margin-bottom: 8px;
        }

        /* ---------------- FOOTER ---------------- */

        footer {
            text-align: center;
            padding: 35px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
        }

        /* ---------------- MOBILE ---------------- */

        @media (max-width: 700px) {

            .nav-links {
                display: none;
            }

            main {
                padding: 40px 16px 60px;
            }

            .subject-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 46px;
            }

            .paper-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .paper-actions {
                width: 100%;
            }

            .paper-btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="nav-inner">

        <div class="logo">
            Cashew<span>Papers</span>
        </div>

        <div class="nav-links">
            <a href="#" onclick="showHome(); return false;">Home</a>
        </div>

    </div>
</nav>

<main id="app"></main>

<footer>
    Cashew Papers · Built for students
</footer>


<script>

/* ============================================================
   CONFIGURATION
   ============================================================ */

const GITHUB_OWNER = "ugaryt-market";
const GITHUB_REPO = "cashewpapers";
const GITHUB_BRANCH = "main";

const GITHUB_TREE_URL =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;

const RAW_BASE =
    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}`;


/* ============================================================
   SUBJECTS
   ============================================================ */

const subjects = {

    mathematics: {
        name: "Mathematics",
        code: "9709",
        icon: "📐",
        description: "AS & A Level Mathematics past papers."
    },

    physics: {
        name: "Physics",
        code: "9702",
        icon: "⚛️",
        description: "AS & A Level Physics past papers."
    },

    chemistry: {
        name: "Chemistry",
        code: "9701",
        icon: "🧪",
        description: "AS & A Level Chemistry past papers."
    },

    biology: {
        name: "Biology",
        code: "9700",
        icon: "🧬",
        description: "AS & A Level Biology past papers."
    }

};


/* ============================================================
   PAPER DATABASE
   ============================================================ */

/*
   Instead of requesting every folder individually from GitHub,
   we load the repository tree once and build our own local
   paper database from the filenames.

   Example:

   papers/mathematics/2025/mj/9709_s25_qp_11.pdf

   becomes:

   Subject: mathematics
   Year: 2025
   Folder: mj
   Session: s25
   Type: qp
   Paper: 11
*/

let repositoryFiles = null;
let paperDatabase = {};


async function loadRepositoryFiles() {

    if (repositoryFiles) {
        return repositoryFiles;
    }

    const response = await fetch(
        GITHUB_TREE_URL,
        {
            cache: "no-store"
        }
    );

    if (!response.ok) {

        throw new Error(
            `GitHub returned ${response.status}`
        );

    }

    const data = await response.json();

    if (data.truncated) {

        throw new Error(
            "The GitHub repository contains too many files for the automatic paper scanner."
        );

    }

    repositoryFiles = data.tree
        .filter(item =>
            item.type === "blob" &&
            item.path.toLowerCase().startsWith("papers/") &&
            item.path.toLowerCase().endsWith(".pdf")
        );

    buildPaperDatabase();

    return repositoryFiles;
}


/* ============================================================
   FILENAME PARSER
   ============================================================ */

/*
   Supported examples:

   9709_s25_qp_11.pdf
   9709_s25_ms_11.pdf
   9709_s25_er_11.pdf
   9709_s25_in_11.pdf

   qp = Question Paper
   ms = Mark Scheme
   er = Examiner Report
   in = Insert
*/

function parseFilename(filename) {

    const match = filename.match(
        /^(\d+)_([a-z]\d{2})_(qp|ms|er|in)_(\d+)\.pdf$/i
    );

    if (!match) {
        return null;
    }

    return {
        code: match[1],
        sessionCode: match[2].toLowerCase(),
        type: match[3].toLowerCase(),
        paper: match[4]
    };
}


/* ============================================================
   SESSION NAME
   ============================================================ */

function sessionName(sessionCode) {

    if (!sessionCode) {
        return "Unknown Session";
    }

    const type =
        sessionCode[0].toLowerCase();

    const year =
        `20${sessionCode.substring(1)}`;

    if (type === "s") {
        return `May / June ${year}`;
    }

    if (type === "w") {
        return `October / November ${year}`;
    }

    if (type === "m") {
        return `March ${year}`;
    }

    return sessionCode.toUpperCase();
}


/* ============================================================
   BUILD PAPER DATABASE
   ============================================================ */

function buildPaperDatabase() {

    paperDatabase = {};

    for (const file of repositoryFiles) {

        /*
           Expected path:

           papers/
           subject/
           year/
           session folder/
           filename.pdf
        */

        const parts =
            file.path.split("/");

        if (parts.length < 5) {
            continue;
        }

        const subjectKey = parts[1];
        const year = parts[2];
        const folder = parts[3];
        const filename = parts[4];

        if (!subjects[subjectKey]) {
            continue;
        }

        const parsed =
            parseFilename(filename);

        if (!parsed) {
            continue;
        }

        /*
           Only include files belonging to the
           subject code configured above.
        */

        if (
            parsed.code !==
            subjects[subjectKey].code
        ) {
            continue;
        }

        if (!paperDatabase[subjectKey]) {
            paperDatabase[subjectKey] = {};
        }

        if (!paperDatabase[subjectKey][year]) {
            paperDatabase[subjectKey][year] = {};
        }

        if (!paperDatabase[subjectKey][year][folder]) {
            paperDatabase[subjectKey][year][folder] = {
                sessionCode: parsed.sessionCode,
                papers: {}
            };
        }

        const session =
            paperDatabase[subjectKey][year][folder];

        if (!session.papers[parsed.paper]) {

            session.papers[parsed.paper] = {

                paper: parsed.paper,

                question: null,

                markScheme: null,

                examinerReport: null,

                insert: null

            };

        }

        const currentPaper =
            session.papers[parsed.paper];


        if (parsed.type === "qp") {

            currentPaper.question =
                file.path;

        }


        if (parsed.type === "ms") {

            currentPaper.markScheme =
                file.path;

        }


        if (parsed.type === "er") {

            currentPaper.examinerReport =
                file.path;

        }


        if (parsed.type === "in") {

            currentPaper.insert =
                file.path;

        }

    }

}


/* ============================================================
   GET SUBJECT YEARS
   ============================================================ */

function getSubjectYears(subjectKey) {

    const data =
        paperDatabase[subjectKey] || {};

    return Object.keys(data)
        .sort(
            (a, b) =>
                Number(b) - Number(a)
        );

}


/* ============================================================
   GET SUBJECT SESSIONS
   ============================================================ */

function getSubjectSessions(
    subjectKey,
    year
) {

    const data =
        paperDatabase[subjectKey]?.[year] || {};

    return Object.entries(data)
        .sort((a, b) => {

            const sessionA =
                a[1].sessionCode || "";

            const sessionB =
                b[1].sessionCode || "";

            return sessionA.localeCompare(sessionB);

        });

}


/* ============================================================
   GET SESSION PAPERS
   ============================================================ */

function getSessionPapers(
    subjectKey,
    year,
    folder
) {

    const session =
        paperDatabase[
            subjectKey
        ]?.[
            year
        ]?.[
            folder
        ];

    if (!session) {
        return [];
    }

    return Object.values(
        session.papers
    ).sort(
        (a, b) =>
            a.paper.localeCompare(
                b.paper,
                undefined,
                { numeric: true }
            )
    );

}


/* ============================================================
   HOME PAGE
   ============================================================ */

function showHome() {

    const app =
        document.getElementById("app");

    app.innerHTML = `

        <section class="hero">

            <h1>
                Find your <span>past papers.</span>
            </h1>

            <p>
                A simple, modern place to find
                past papers and mark schemes.
            </p>

            <div class="version">
                Version Alpha 0.0.01
            </div>

        </section>


        <div class="search-wrapper">

            <div class="search-box">

                <div class="search-icon">
                    🔍
                </div>

                <input
                    id="homeSearch"
                    type="text"
                    placeholder="Search subjects..."
                    oninput="searchSubjects(this.value)"
                >

            </div>

        </div>


        <div class="section-title">

            <h2>Subjects</h2>

            <p>
                Choose a subject to browse past papers.
            </p>

        </div>


        <div
            class="subject-grid"
            id="subjectGrid"
        >

            ${renderSubjectCards()}

        </div>

    `;

}


/* ============================================================
   SUBJECT CARDS
   ============================================================ */

function renderSubjectCards(filter = "") {

    const query =
        filter.toLowerCase().trim();

    return Object.entries(subjects)
        .filter(([key, subject]) => {

            return (
                subject.name
                    .toLowerCase()
                    .includes(query) ||

                subject.code
                    .includes(query)
            );

        })
        .map(([key, subject]) => `

            <div
                class="subject-card"
                onclick="showSubject('${key}')"
            >

                <div class="subject-top">

                    <div class="subject-icon">
                        ${subject.icon}
                    </div>

                    <div class="arrow">
                        →
                    </div>

                </div>


                <h3>
                    ${subject.name}
                </h3>


                <div class="subject-code">
                    Cambridge ${subject.code}
                </div>


                <div class="subject-description">
                    ${subject.description}
                </div>

            </div>

        `)
        .join("");

}


function searchSubjects(query) {

    document.getElementById(
        "subjectGrid"
    ).innerHTML =
        renderSubjectCards(query);

}


/* ============================================================
   SUBJECT PAGE
   ============================================================ */

async function showSubject(subjectKey) {

    const subject =
        subjects[subjectKey];

    const app =
        document.getElementById("app");


    app.innerHTML = `

        <div class="page-header">

            <button
                class="back-btn"
                onclick="showHome()"
            >
                ← Back to subjects
            </button>

            <h1>
                ${subject.name} ${subject.code}
            </h1>

            <p>
                ${subject.description}
            </p>

        </div>


        <div class="loading">

            <div class="spinner"></div>

            Loading papers...

        </div>

    `;


    try {

        await loadRepositoryFiles();


        const years =
            getSubjectYears(subjectKey);


        if (years.length === 0) {

            app.innerHTML = `

                <div class="page-header">

                    <button
                        class="back-btn"
                        onclick="showHome()"
                    >
                        ← Back to subjects
                    </button>

                    <h1>
                        ${subject.name} ${subject.code}
                    </h1>

                    <p>
                        ${subject.description}
                    </p>

                </div>

                <div class="empty">

                    No papers have been added yet.

                </div>

            `;

            return;

        }


        app.innerHTML = `

            <div class="page-header">

                <button
                    class="back-btn"
                    onclick="showHome()"
                >
                    ← Back to subjects
                </button>

                <h1>
                    ${subject.name} ${subject.code}
                </h1>

                <p>
                    ${subject.description}
                </p>

            </div>


            <div class="filters">

                <button
                    class="filter-btn active"
                    onclick="filterYears(this, 'all')"
                >
                    All Years
                </button>

                ${years.map(year => `

                    <button
                        class="filter-btn"
                        onclick="filterYears(
                            this,
                            '${year}'
                        )"
                    >
                        ${year}
                    </button>

                `).join("")}

            </div>


            <div id="yearContainer">

                ${years.map(year => {

                    const sessions =
                        getSubjectSessions(
                            subjectKey,
                            year
                        );

                    return `

                        <section
                            class="year-section"
                            data-year="${year}"
                        >

                            <h2 class="year-title">
                                ${year}
                            </h2>


                            <div class="session-list">

                                ${
                                    sessions.length
                                    ? sessions.map(
                                        ([folder, session]) => {

                                            const papers =
                                                Object.values(
                                                    session.papers
                                                );

                                            return `

                                                <div
                                                    class="session-card"
                                                    onclick='showSession(
                                                        "${subjectKey}",
                                                        "${year}",
                                                        "${folder}"
                                                    )'
                                                >

                                                    <div class="session-left">

                                                        <div class="folder-icon">
                                                            📁
                                                        </div>

                                                        <div>

                                                            <div class="session-name">
                                                                ${sessionName(
                                                                    session.sessionCode
                                                                )}
                                                            </div>

                                                            <div class="session-count">
                                                                ${papers.length}
                                                                paper${papers.length !== 1 ? "s" : ""}
                                                            </div>

                                                        </div>

                                                    </div>

                                                    <div class="session-arrow">
                                                        →
                                                    </div>

                                                </div>

                                            `;

                                        }
                                    ).join("")
                                    : `
                                        <div class="empty">
                                            No papers found for ${year}.
                                        </div>
                                    `
                                }

                            </div>

                        </section>

                    `;

                }).join("")}

            </div>

        `;

    } catch (error) {

        console.error(
            "Paper loading error:",
            error
        );


        app.innerHTML = `

            <div class="page-header">

                <button
                    class="back-btn"
                    onclick="showHome()"
                >
                    ← Back to subjects
                </button>

                <h1>
                    ${subject.name} ${subject.code}
                </h1>

            </div>


            <div class="error-message">

                <strong>
                    Could not load the papers.
                </strong>

                The website could not read the
                public GitHub repository.

                <br><br>

                Check that:

                <br>

                • The repository is public

                <br>

                • The repository name is
                <strong style="display:inline;">
                    ${GITHUB_REPO}
                </strong>

                <br>

                • The files are inside the
                <strong style="display:inline;">
                    papers/
                </strong>
                folder

                <br><br>

                Technical error:
                ${error.message}

            </div>

        `;

    }

}


/* ============================================================
   YEAR FILTER
   ============================================================ */

function filterYears(
    button,
    year
) {

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    document
        .querySelectorAll(".year-section")
        .forEach(section => {

            if (
                year === "all" ||
                section.dataset.year === year
            ) {

                section.style.display = "";

            } else {

                section.style.display = "none";

            }

        });

}


/* ============================================================
   SESSION PAGE
   ============================================================ */

function showSession(
    subjectKey,
    year,
    folder
) {

    const subject =
        subjects[subjectKey];

    const session =
        paperDatabase[
            subjectKey
        ]?.[
            year
        ]?.[
            folder
        ];


    const app =
        document.getElementById("app");


    if (!session) {

        app.innerHTML = `

            <div class="empty">
                This session could not be found.
            </div>

        `;

        return;

    }


    const papers =
        getSessionPapers(
            subjectKey,
            year,
            folder
        );


    const title =
        sessionName(
            session.sessionCode
        );


    app.innerHTML = `

        <div class="page-header">

            <button
                class="back-btn"
                onclick="showSubject('${subjectKey}')"
            >
                ← Back to ${subject.name}
            </button>

            <h1>
                ${title}
            </h1>

            <p>
                ${subject.name}
                ${subject.code}
            </p>

        </div>


        <div class="paper-list">

            ${
                papers.length
                ? papers.map(
                    paper =>
                        renderPaper(
                            paper,
                            subject,
                            year,
                            title
                        )
                ).join("")
                : `
                    <div class="empty">
                        No papers found.
                    </div>
                `
            }

        </div>

    `;

}


/* ============================================================
   PAPER CARD
   ============================================================ */

function renderPaper(
    paper,
    subject,
    year,
    session
) {

    return `

        <div class="paper-card">

            <div class="paper-info">

                <h3>
                    Paper ${paper.paper}
                </h3>

                <p>
                    ${subject.name}
                    ${subject.code}
                    · ${year}
                    · ${session}
                </p>

            </div>


            <div class="paper-actions">

                ${
                    paper.question
                    ? `
                        <button
                            class="paper-btn primary"
                            onclick='openPDF("${paper.question}")'
                        >
                            📄 Question Paper
                        </button>
                    `
                    : ""
                }


                ${
                    paper.markScheme
                    ? `
                        <button
                            class="paper-btn"
                            onclick='openPDF("${paper.markScheme}")'
                        >
                            ✅ Mark Scheme
                        </button>
                    `
                    : ""
                }


                ${
                    paper.examinerReport
                    ? `
                        <button
                            class="paper-btn"
                            onclick='openPDF("${paper.examinerReport}")'
                        >
                            📋 Examiner Report
                        </button>
                    `
                    : ""
                }


                ${
                    paper.insert
                    ? `
                        <button
                            class="paper-btn"
                            onclick='openPDF("${paper.insert}")'
                        >
                            📎 Insert
                        </button>
                    `
                    : ""
                }

            </div>

        </div>

    `;

}


/* ============================================================
   OPEN PDF
   ============================================================ */

function openPDF(path) {

    const url =
        `${RAW_BASE}/${path
            .split("/")
            .map(
                part => encodeURIComponent(part)
            )
            .join("/")
        }`;


    window.open(
        url,
        "_blank"
    );

}


/* ============================================================
   START
   ============================================================ */

showHome();

</script>
